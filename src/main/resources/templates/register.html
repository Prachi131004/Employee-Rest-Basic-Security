<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-100">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-extrabold text-slate-800 tracking-tight">Create Account</h2>
            <p class="text-slate-500 text-sm mt-2">Register a new employee into the system</p>
        </div>

        <form th:action="@{/public/register}" th:object="${employee}" method="POST" class="space-y-5">
            
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Email Address</label>
                <input type="email" th:field="*{email}" placeholder="name@company.com" required
                       class="w-full px-4 py-2.5 rounded-lg border border-slate-300 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition duration-150"/>
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Password</label>
                <input type="password" th:field="*{password}" placeholder="••••••••" required
                       class="w-full px-4 py-2.5 rounded-lg border border-slate-300 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition duration-150"/>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Salary ($)</label>
                    <input type="number" step="0.1" th:field="*{salary}" placeholder="50000" required
                           class="w-full px-4 py-2.5 rounded-lg border border-slate-300 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition duration-150"/>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Department</label>
                    <input type="text" th:field="*{departmentName}" placeholder="IT / HR" required
                           class="w-full px-4 py-2.5 rounded-lg border border-slate-300 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition duration-150"/>
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Assign System Role</label>
                <select th:field="*{role}" required
                        class="w-full px-4 py-2.5 rounded-lg border border-slate-300 bg-white text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition duration-150">
                    <option value="ROLE_USER">Regular Employee (USER)</option>
                    <option value="ROLE_ADMIN">Administrator (ADMIN)</option>
                </select>
            </div>

            <button type="submit" 
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg shadow-md hover:shadow-lg transform active:scale-[0.98] transition duration-150 mt-2">
                Register Employee
            </button>
        </form>

        <div class="relative flex py-4 items-center mt-6">
            <div class="flex-grow border-t border-slate-200"></div>
            <span class="flex-shrink mx-4 text-slate-400 text-xs uppercase tracking-wider">or</span>
            <div class="flex-grow border-t border-slate-200"></div>
        </div>

        <div class="text-center">
            <p class="text-sm text-slate-600">
                Already registered? 
                <a th:href="@{/login}" class="text-indigo-600 hover:text-indigo-800 font-semibold hover:underline transition duration-150">
                    Sign In here
                </a>
            </p>
        </div>
    </div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Update Employee Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6 font-sans">

    <div class="max-w-2xl w-full bg-white p-8 rounded-xl shadow-lg border border-gray-200">
        
        <div class="border-b pb-4 mb-6">
            <h1 class="text-2xl font-bold text-gray-800">⚙️ Update Employee Profile</h1>
            <p class="text-sm text-gray-500 mt-1">Modify the details for Employee ID: <span class="font-mono font-bold text-indigo-600" th:text="${employee.id}"></span></p>
        </div>

        <form th:action="@{/admin/employee/update/{id}(id=${employee.id})}" th:object="${employee}" method="POST" class="space-y-5">
            
            <input type="hidden" th:field="*{id}" />

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Email Address</label>
                    <input type="email" th:field="*{email}" required
                           class="w-full px-4 py-2 border rounded-lg text-sm bg-gray-50 text-gray-500 cursor-not-allowed outline-none" readonly/>
                    <p class="text-xs text-gray-400 mt-1">Email cannot be changed.</p>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Password (Leave blank to keep same)</label>
                    <input type="password" th:field="*{password}" placeholder="••••••••"
                           class="w-full px-4 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none"/>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Salary ($)</label>
                    <input type="number" step="0.1" th:field="*{salary}" required placeholder="e.g. 50000"
                           class="w-full px-4 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none"/>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Department Name</label>
                    <input type="text" th:field="*{departmentName}" required placeholder="e.g. Technology"
                           class="w-full px-4 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none"/>
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Security Role</label>
                <select th:field="*{role}" required
                        class="w-full px-4 py-2 border rounded-lg text-sm bg-white focus:ring-2 focus:ring-indigo-500 outline-none">
                    <option value="ROLE_USER">ROLE_USER (Standard Employee)</option>
                    <option value="ROLE_ADMIN">ROLE_ADMIN (Administrator)</option>
                </select>
            </div>

            <div class="flex justify-end gap-3 pt-4 border-t">
                <a th:href="@{/employees}" 
                   class="px-5 py-2 rounded-lg text-sm font-medium text-gray-700 bg-gray-200 hover:bg-gray-300 transition">
                    Cancel
                </a>
                <button type="submit" 
                        class="px-5 py-2 rounded-lg text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 shadow-md transition">
                    Save Changes
                </button>
            </div>
        </form>

    </div>

</body>
</html>

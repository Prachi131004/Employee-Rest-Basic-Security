<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Control Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6 font-sans">
    <div class="max-w-6xl mx-auto bg-white p-6 rounded-xl shadow-md space-y-8">
        
        <div class="flex justify-between items-center border-b pb-4">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">Admin Dashboard</h1>
                <p class="text-sm text-amber-600 font-bold uppercase tracking-wider">Clearance: Systems Administrator</p>
            </div>
            <form th:action="@{/logout}" method="POST">
                <button type="submit" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-md text-sm font-semibold transition">Logout</button>
            </form>
        </div>

        <div class="bg-gray-50 p-5 rounded-lg border border-gray-200">
            <h3 class="text-lg font-bold text-gray-700 mb-4" 
                th:text="${newEmployee.id != null} ? '⚙️ Update Employee Details' : '➕ Add New Employee'"></h3>
            
            <form th:action="${newEmployee.id != null} ? @{/admin/employee/update/{id}(id=${newEmployee.id})} : @{/admin/employee/add}" 
                  th:object="${newEmployee}" method="POST" class="grid grid-cols-1 md:grid-cols-5 gap-4 items-end">
                
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">Email Address</label>
                    <input type="email" th:field="*{email}" placeholder="email@company.com" required
                           class="w-full px-3 py-2 border rounded-md text-sm focus:ring-2 focus:ring-indigo-500 outline-none"/>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">Password</label>
                    <input type="password" th:field="*{password}" placeholder="••••••••" th:required="${newEmployee.id == null}"
                           class="w-full px-3 py-2 border rounded-md text-sm focus:ring-2 focus:ring-indigo-500 outline-none"/>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">Salary</label>
                    <input type="number" step="0.1" th:field="*{salary}" placeholder="Salary" required
                           class="w-full px-3 py-2 border rounded-md text-sm focus:ring-2 focus:ring-indigo-500 outline-none"/>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">Department Name</label>
                    <input type="text" th:field="*{departmentName}" placeholder="Department" required
                           class="w-full px-3 py-2 border rounded-md text-sm focus:ring-2 focus:ring-indigo-500 outline-none"/>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">Role Type</label>
                    <select th:field="*{role}" required
                            class="w-full px-3 py-2 border rounded-md text-sm bg-white focus:ring-2 focus:ring-indigo-500 outline-none">
                        <option value="ROLE_USER">ROLE_USER</option>
                        <option value="ROLE_ADMIN">ROLE_ADMIN</option>
                    </select>
                </div>

                <div class="md:col-span-5 flex justify-end gap-2 mt-2">
                    <a th:if="${newEmployee.id != null}" th:href="@{/employees}" class="bg-gray-400 hover:bg-gray-500 text-white px-4 py-2 rounded-md text-sm font-semibold">Cancel</a>
                    <button type="submit" 
                            th:class="${newEmployee.id != null} ? 'bg-amber-500 hover:bg-amber-600 text-white px-5 py-2 rounded-md text-sm font-semibold' : 'bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-md text-sm font-semibold'"
                            th:text="${newEmployee.id != null} ? 'Save Changes' : 'Submit Employee'"></button>
                </div>
            </form>
        </div>

        <div>
            <h3 class="text-xl font-bold text-gray-800 mb-4">Master Employee Registry</h3>
            <div class="overflow-x-auto border rounded-lg shadow-sm">
                <table class="w-full border-collapse bg-white text-left text-sm text-gray-600">
                    <thead class="bg-gray-50 border-b font-semibold text-gray-700 uppercase text-xs">
                        <tr>
                            <th class="px-6 py-3">ID</th>
                            <th class="px-6 py-3">Email Address</th>
                            <th class="px-6 py-3">Department Name</th>
                            <th class="px-6 py-3">Salary</th>
                            <th class="px-6 py-3">Role</th>
                            <th class="px-6 py-3 text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y text-gray-700">
                        <tr th:each="emp : ${employeesList}" class="hover:bg-gray-50">
                            <td class="px-6 py-4 font-mono text-xs text-gray-500" th:text="${emp.id}"></td>
                            <td class="px-6 py-4 font-semibold" th:text="${emp.email}"></td>
                            <td class="px-6 py-4" th:text="${emp.departmentName}"></td>
                            <td class="px-6 py-4 font-mono text-emerald-600 font-semibold" th:text="'$' + ${emp.salary}"></td>
                            <td class="px-6 py-4">
                                <span th:text="${emp.role}" 
                                      th:class="${emp.role == 'ROLE_ADMIN'} ? 'bg-amber-100 text-amber-800 text-xs px-2 py-0.5 rounded font-bold' : 'bg-blue-100 text-blue-800 text-xs px-2 py-0.5 rounded font-bold'"></span>
                            </td>
                            <td class="px-6 py-4 text-center space-x-3">
                                <a th:href="@{/admin/employee/edit/{id}(id=${emp.id})}" class="text-amber-600 hover:text-amber-800 font-semibold transition">Update</a>
                                <a th:href="@{/admin/employee/delete/{id}(id=${emp.id})}" onclick="return confirm('Delete this record?')" class="text-red-600 hover:text-red-800 font-semibold transition">Delete</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</body>
</html>
